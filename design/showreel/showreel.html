<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Litwave Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --text: #ECEEF3; --muted: #A6ADBB; --accent: #8E86FF; --ink: #0A0C10; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Geist, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  canvas { width: min(100%, calc((100dvh - 32px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 14px; background: #07080B; box-shadow: 0 30px 90px rgba(0, 0, 0, .6); }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, rgba(10, 12, 16, .55), rgba(0, 0, 0, .85)); transition: opacity .5s ease; }
  .overlay.is-hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { margin: 0; font-size: clamp(36px, 7vw, 72px); font-weight: 700; letter-spacing: -0.04em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 15px; }
  .play { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 26px 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--ink); font: 600 17px Geist, system-ui, sans-serif; cursor: pointer; box-shadow: 0 12px 40px rgba(142, 134, 255, .45); transition: transform .15s ease; }
  .play:hover { transform: scale(1.04); }
  .play:active { transform: scale(.96); }
  .play:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .overlay, .play { transition: none; } }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
</style>
</head>
<body>
<div class="stage"><canvas id="reel" width="1920" height="1080" aria-label="Litwave showreel"></canvas></div>
<div class="overlay" id="overlay">
  <h1>Litwave</h1>
  <p id="overlayText">Showreel · 1 minute · sound on</p>
  <button type="button" class="play" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span id="playLabel">Play showreel</span></button>
</div>

<script>
"use strict";
/* =====================================================================
   Litwave showreel — every frame and every sound is generated in code.
   render(t) is a pure function of time, and the score is a fixed list of
   events, so the same file plays live and renders offline to video.
   ===================================================================== */

const W = 1920, H = 1080, FPS = 60;
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
const DURATION = 63;
const SANS = "Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif";

const DARK = {

  keyW: "#DADDE4", keyB: "#1B1F28", keyLine: "#0A0C10",

/* =====================================================================

const PROG = [

  { t: 29.0, bank: 0, pad: 1, fx: "sweepUp" },
  { t: 30.0, bank: 0, pad: 4, fx: "vox" },

const SCORE = buildScore();

const canvas = document.getElementById("reel");

      text(w.s, cx, y + (1 - p) * rise, Object.assign({}, o, w.o || {}, { align: "left", color: w.color || o.color }));

function finish(t) {

}

function shake(t) {

  [[8, 14], [28, 5], [44, 7], [52, 16]].forEach(([ti, a]) => {

/* ---------- The wave motif ---------- */
function waveLines(t, x0, x1, yc, amp, o = {}) {
  const layers = o.layers || 4, reveal = o.reveal ?? 1, alpha = o.alpha ?? 1;
  const xr = x0 + (x1 - x0) * reveal;
  g.save();
  const gr = g.createLinearGradient(x0, 0, x1, 0);
  gr.addColorStop(0, withAlpha(o.c1 || DARK.accent, 0)); gr.addColorStop(.2, o.c1 || DARK.accent);
  gr.addColorStop(.75, o.c2 || "#5AA9FF"); gr.addColorStop(1, withAlpha(o.c2 || "#5AA9FF", 0));
  g.strokeStyle = gr; g.lineCap = "round";
  if (o.glow) { g.shadowColor = o.c1 || DARK.accent; g.shadowBlur = o.glow; }
  for (let k = 0; k < layers; k++) {
    g.globalAlpha = alpha * (1 - k / (layers + 1));
    g.lineWidth = (o.width || 2.5) * (1 - k * .15);
    g.beginPath();
    for (let x = x0; x <= xr; x += 6) {
      const n = (x - x0) / (x1 - x0), taper = Math.sin(Math.PI * n);
      const y = yc + taper * amp * (Math.sin(x * .0052 * (1 + k * .18) + t * (1.6 + k * .3) + k) * .65 + Math.sin(x * .0131 - t * (2.1 + k * .2) + k * 2) * .35);
      x === x0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}

/* ---------- Reusable UI widgets ---------- */
function beatInfo(t) {
  const bar = Math.floor(t / BAR), inBar = t - bar * BAR;
  return { bar, inBar, frac: inBar / BAR, beat: Math.min(3, Math.floor(inBar / BEAT)) };
}

function keyboard(x, y, w, h, pal, notes, glow, octaves = 2, base = 60) {
  const whites = [0, 2, 4, 5, 7, 9, 11], blacks = [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5]];
  const nW = octaves * 7, ww = w / nW;
  fillRR(x, y, w, h, 12, pal.keyLine);
  g.save(); rr(x, y, w, h, 12); g.clip();
  for (let o = 0; o < octaves; o++) whites.forEach((pc, i) => {
    const on = notes.includes(base + o * 12 + pc), kx = x + (o * 7 + i) * ww;
    fillRR(kx + 1, y, ww - 2, h - 1, [0, 0, 8, 8], on ? pal.accent : pal.keyW);
    if (on && glow > 0) { g.save(); g.shadowColor = pal.accent; g.shadowBlur = 30 * glow; fillRR(kx + 1, y, ww - 2, h - 1, [0, 0, 8, 8], withAlpha("#FFFFFF", .25 * glow)); g.restore(); }
  });
  for (let o = 0; o < octaves; o++) blacks.forEach(([pc, after]) => {

    fillRR(kx, y, bw, h * .6, [0, 0, 6, 6], on ? pal.accent : pal.keyB);
  });
  g.restore();
}

}

function render(t) {
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g.globalAlpha = 1; g.filter = "none";
  const [sx, sy] = shake(t);
  g.save(); g.translate(sx, sy);
  const energy = t < 8 ? .45 + .4 * prog(t, 0, 8) : t > 52 ? 1.2 - .4 * prog(t, 56, 63) : 1 + .25 * pulse(KICKS, t, 6);
  background(t, DARK, energy);
  sceneIntro(t);
  sceneLogo(t);
  sceneChords(t);
  sceneAnalysis(t);
  scenePads(t);
  sceneRemote(t);
  sceneMontage(t);
  sceneOutro(t);
  g.restore();
  finish(t);
}

/* =====================================================================
   PLAYBACK (live) and EXPORT (offline) entry points
   ===================================================================== */
const fontsReady = (async () => {
  try {
    await Promise.race([
      Promise.all(["700 100px Geist", "650 100px Geist", "600 100px Geist", "500 100px Geist", "500 30px 'Geist Mono'", "600 30px 'Geist Mono'"].map((f) => document.fonts.load(f))),
      new Promise((r) => setTimeout(r, 4000))
    ]);
  } catch (e) { /* fall back to system fonts */ }
})();

let live = null;
async function playLive() {
  const px = Math.min(1920, Math.max(960, canvas.clientWidth * (window.devicePixelRatio || 1)));
  SCALE = px / 1920; canvas.width = Math.round(W * SCALE); canvas.height = Math.round(H * SCALE);
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC({ latencyHint: "playback" });
  await ac.resume();
  const eng = new AudioEngine(ac);
  const t0 = ac.currentTime + .35;
  eng.automate(t0);
  let next = 0;
  const queue = SCORE.map((e) => ({ e, start: eng.startOf(e) })).sort((a, b) => a.start - b.start);
  const pump = () => {
    const horizon = ac.currentTime - t0 + 2.0;
    while (next < queue.length && queue[next].start <= horizon) { const e = queue[next].e; eng.play(e, t0 + e.t); next++; }
  };
  pump();
  const timer = setInterval(pump, 100);
  live = { ac, timer };
  document.getElementById("overlay").classList.add("is-hidden");
  const frame = () => {
    const lat = ac.outputLatency || ac.baseLatency || 0;
    const t = ac.currentTime - t0 - lat;
    render(Math.max(0, t));
    if (t < DURATION) requestAnimationFrame(frame);
    else {
      clearInterval(timer); ac.close(); live = null;
      document.getElementById("playLabel").textContent = "Watch again";
      document.getElementById("overlayText").textContent = "Litwave · showreel";
      document.getElementById("overlay").classList.remove("is-hidden");
    }
  };
  requestAnimationFrame(frame);
}

document.getElementById("playBtn").addEventListener("click", () => { if (!live) playLive(); });
document.addEventListener("keydown", (e) => { if (e.code === "Space" && !live) { e.preventDefault(); playLive(); } });
fontsReady.then(() => render(9.6));

// Offline export API (used by render.mjs)
window.SHOWREEL = {
  W, H, FPS, DURATION, fontsReady,
  frame(t, quality = .93) { if (SCALE !== 1) { SCALE = 1; canvas.width = W; canvas.height = H; } render(t); return canvas.toDataURL("image/jpeg", quality); },
  async renderAudio(sampleRate = 48000, solo = null) {
    const oc = new OfflineAudioContext(2, Math.ceil(DURATION * sampleRate), sampleRate);
    const eng = new AudioEngine(oc);
    if (solo) ["drums", "music", "sfx"].forEach((b) => { if (b !== solo) eng[b].gain.value = 0; });
    eng.automate(0);
    SCORE.forEach((e) => eng.play(e, e.t));
    const buf = await oc.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
    const out = new Int16Array(n * 2), rnd = mulberry32(2);
    let peak = 0;
    for (let i = 0; i < n; i++) {
      peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
      out[i * 2] = Math.max(-32768, Math.min(32767, Math.round(L[i] * 32767 + (rnd() - rnd()))));
      out[i * 2 + 1] = Math.max(-32768, Math.min(32767, Math.round(R[i] * 32767 + (rnd() - rnd()))));
    }
    const bytes = new Uint8Array(out.buffer);
    let bin = ""; const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    window.__pcm = btoa(bin);
    return { length: window.__pcm.length, sampleRate, frames: n, peak };
  },
  pcmChunk(i, size) { return window.__pcm.slice(i, i + size); }
};
