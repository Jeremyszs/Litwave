[project]
name = "montage-practice-daw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeremyszs", email = "jeremyrukmana@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "asio>=1.1",
    "librosa>=0.11.0",
    "mido>=1.3.3",
    "miniaudio>=1.71",
    "pedalboard>=0.9.24",
    "pefile>=2024.8.26",
    "python-multipart>=0.0.32",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
    "wsproto>=1.3.2",
]

[project.scripts]
litwave = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
